[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "probejs"
version = "1.0.1"
description = "A static analysis framework for JavaScript vulnerability detection"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "func_timeout~=4.3.5",
    "networkx~=2.4",
    "sty~=1.0.0rc0",
    "z3-solver~=4.8.8.0",
    "tqdm~=4.48.2",
    "openai",
    "loguru",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "setuptools",
    "pytest",
    "pytest-cov",
]

[project.scripts]
probejs = "probejs.__main__:main"
probejs-setup = "probejs._setup:main"

[tool.setuptools.packages.find]
include = ["probejs*"]

[tool.setuptools.package-data]
# Bundle the JavaScript/TypeScript parser sources (not node_modules — those
# are installed lazily at runtime via ``probejs/_setup.py``).
probejs = [
    "_parser/*.js", "_parser/*.json", "_parser/*.sh", "_parser/*.py",
    "builtin_packages/*.js",
]
